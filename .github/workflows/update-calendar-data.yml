# ════════════════════════════════════════════════════════════
# MJ Coffee Science — Calendar Data Auto-Update
# 작성: Hanrim (Cozy Shelter)
#
# [동작]
# 매월 1일 자정(KST)에 자동 실행
# 한국천문연구원 API에서 당월 공휴일 + 음력 데이터를 가져와
# mjcafe-data 저장소에 JSON으로 저장합니다.
#
# [Secrets 설정 필요]
# 저장소 Settings → Secrets and variables → Actions → New repository secret
# · KASI_API_KEY : 한국천문연구원 일반 인증키 (디코딩된 키)
#
# [생성 파일]
# · data/holidays-YYYY.json  — 해당 연도 공휴일 목록
# · data/lunar-YYYY-MM.json  — 해당 월 음력 데이터
# ════════════════════════════════════════════════════════════

name: Update Calendar Data

on:
  # 매월 1일 자정(UTC 15:00 = KST 00:00) 자동 실행
  schedule:
    - cron: '0 15 1 * *'
  # 수동 실행 (테스트용)
  workflow_dispatch:
    inputs:
      year:
        description: '연도 (기본값: 현재 연도)'
        required: false
      month:
        description: '월 (기본값: 현재 월)'
        required: false

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up date variables
        id: date
        run: |
          YEAR="${{ github.event.inputs.year }}"
          MONTH="${{ github.event.inputs.month }}"
          if [ -z "$YEAR" ]; then YEAR=$(TZ='Asia/Seoul' date +%Y); fi
          if [ -z "$MONTH" ]; then MONTH=$(TZ='Asia/Seoul' date +%m); fi
          echo "year=$YEAR" >> $GITHUB_OUTPUT
          echo "month=$MONTH" >> $GITHUB_OUTPUT
          echo "연도: $YEAR, 월: $MONTH"

      - name: Create data directory
        run: mkdir -p data

      - name: Fetch holiday data
        env:
          KASI_API_KEY: ${{ secrets.KASI_API_KEY }}
        run: |
          YEAR="${{ steps.date.outputs.year }}"
          MONTH="${{ steps.date.outputs.month }}"
          OUTPUT_FILE="data/holidays-${YEAR}.json"

          echo "공휴일 데이터 수집 중: ${YEAR}년"

          # 12개월 전체 공휴일 수집
          python3 << PYEOF
          import urllib.request
          import json
          import os

          api_key = os.environ['KASI_API_KEY']
          year = '${YEAR}'
          all_holidays = {}

          for month in range(1, 13):
            month_str = str(month).zfill(2)
            url = (
              f'http://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService/getHoliDeInfo'
              f'?serviceKey={api_key}'
              f'&solYear={year}'
              f'&solMonth={month_str}'
              f'&_type=json'
              f'&numOfRows=50'
            )
            try:
              req = urllib.request.Request(url, headers={'Accept': 'application/json'})
              with urllib.request.urlopen(req, timeout=10) as res:
                data = json.loads(res.read().decode('utf-8'))
                items = data.get('response', {}).get('body', {}).get('items', {})
                if items:
                  item_list = items.get('item', [])
                  if isinstance(item_list, dict):
                    item_list = [item_list]
                  for item in item_list:
                    date_str = str(item.get('locdate', ''))
                    if date_str:
                      all_holidays[date_str] = {
                        'name': item.get('dateName', ''),
                        'isHoliday': item.get('isHoliday', 'N') == 'Y'
                      }
              print(f'{month_str}월 완료')
            except Exception as e:
              print(f'{month_str}월 오류: {e}')

          result = {
            '_meta': {
              'year': year,
              'source': '한국천문연구원 특일정보 API',
              'updated': __import__('datetime').datetime.utcnow().isoformat() + 'Z'
            },
            'holidays': all_holidays
          }

          with open('${OUTPUT_FILE}', 'w', encoding='utf-8') as f:
            json.dump(result, f, ensure_ascii=False, indent=2)

          print(f'공휴일 {len(all_holidays)}건 저장 완료')
          PYEOF

      - name: Fetch lunar data
        env:
          KASI_API_KEY: ${{ secrets.KASI_API_KEY }}
        run: |
          YEAR="${{ steps.date.outputs.year }}"
          MONTH="${{ steps.date.outputs.month }}"
          OUTPUT_FILE="data/lunar-${YEAR}-${MONTH}.json"

          echo "음력 데이터 수집 중: ${YEAR}년 ${MONTH}월"

          python3 << PYEOF
          import urllib.request
          import json
          import os
          import calendar

          api_key = os.environ['KASI_API_KEY']
          year = '${YEAR}'
          month = '${MONTH}'

          # 해당 월의 일수 계산
          days_in_month = calendar.monthrange(int(year), int(month))[1]
          lunar_data = {}

          for day in range(1, days_in_month + 1):
            day_str = str(day).zfill(2)
            url = (
              f'http://apis.data.go.kr/B090041/openapi/service/LrsrCldInfoService/getLunCalInfo'
              f'?serviceKey={api_key}'
              f'&solYear={year}'
              f'&solMonth={month}'
              f'&solDay={day_str}'
              f'&_type=json'
            )
            try:
              req = urllib.request.Request(url, headers={'Accept': 'application/json'})
              with urllib.request.urlopen(req, timeout=10) as res:
                data = json.loads(res.read().decode('utf-8'))
                item = data.get('response', {}).get('body', {}).get('items', {}).get('item', {})
                if item:
                  lunar_data[f'{year}{month}{day_str}'] = {
                    'lunMonth': item.get('lunMonth', ''),
                    'lunDay': item.get('lunDay', ''),
                    'lunLeapmonth': item.get('lunLeapmonth', ''),
                  }
            except Exception as e:
              print(f'{day_str}일 오류: {e}')

          result = {
            '_meta': {
              'year': year,
              'month': month,
              'source': '한국천문연구원 음양력정보 API',
              'updated': __import__('datetime').datetime.utcnow().isoformat() + 'Z'
            },
            'lunar': lunar_data
          }

          with open('${OUTPUT_FILE}', 'w', encoding='utf-8') as f:
            json.dump(result, f, ensure_ascii=False, indent=2)

          print(f'음력 {len(lunar_data)}일 저장 완료')
          PYEOF

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경사항 없음 — 커밋 생략"
          else
            git commit -m "chore: update calendar data ${{ steps.date.outputs.year }}-${{ steps.date.outputs.month }}"
            git push
          fi
