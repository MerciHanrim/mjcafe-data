# ════════════════════════════════════════════════════════════
# MJ Coffee Science — Calendar Data Auto-Update
# 작성: Hanrim (Cozy Shelter)
#
# [동작]
# 매월 1일 자정(KST)에 자동 실행
# 한국천문연구원 API에서 당월 공휴일 + 음력 데이터를 가져와
# mjcafe-data 저장소에 JSON으로 저장합니다.
#
# [Secrets 설정 필요]
# 저장소 Settings → Secrets and variables → Actions → New repository secret
# · KASI_API_KEY : 한국천문연구원 일반 인증키 (디코딩된 키)
#
# [생성 파일]
# · data/holidays-YYYY.json  — 해당 연도 공휴일 목록
# · data/lunar-YYYY-MM.json  — 해당 월 음력 데이터
# · data/posts.json          — 게시글 발행일 (날짜별 그룹, 박제 누적)
#
# [posts.json 동작]
# 사이트맵에서 글 번호 목록을 얻고, archive에 없는 글만 페이지를
# 직접 열어 <meta article:published_time>에서 발행일을 추출합니다.
# 발행일은 변하지 않으므로 한 번 수집된 글은 재수집하지 않습니다
# (첫 실행은 전체 ~180건, 이후엔 신규 글만 — 가볍게 누적).
# ════════════════════════════════════════════════════════════

name: Update Calendar Data

on:
  # 매월 1일 자정(UTC 15:00 = KST 00:00) 자동 실행
  schedule:
    - cron: '0 15 1 * *'
  # 수동 실행 (테스트용)
  workflow_dispatch:
    inputs:
      year:
        description: '연도 (기본값: 현재 연도)'
        required: false
      month:
        description: '월 (기본값: 현재 월)'
        required: false

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up date variables
        id: date
        run: |
          YEAR="${{ github.event.inputs.year }}"
          MONTH="${{ github.event.inputs.month }}"
          if [ -z "$YEAR" ]; then YEAR=$(TZ='Asia/Seoul' date +%Y); fi
          if [ -z "$MONTH" ]; then MONTH=$(TZ='Asia/Seoul' date +%m); fi
          echo "year=$YEAR" >> $GITHUB_OUTPUT
          echo "month=$MONTH" >> $GITHUB_OUTPUT
          echo "연도: $YEAR, 월: $MONTH"

      - name: Create data directory
        run: mkdir -p data

      - name: Fetch holiday data
        env:
          KASI_API_KEY: ${{ secrets.KASI_API_KEY }}
        run: |
          YEAR="${{ steps.date.outputs.year }}"
          MONTH="${{ steps.date.outputs.month }}"
          OUTPUT_FILE="data/holidays-${YEAR}.json"

          echo "공휴일 데이터 수집 중: ${YEAR}년"

          # 12개월 전체 공휴일 수집
          python3 << PYEOF
          import urllib.request
          import json
          import os

          api_key = os.environ['KASI_API_KEY']
          year = '${YEAR}'
          all_holidays = {}

          for month in range(1, 13):
            month_str = str(month).zfill(2)
            url = (
              f'http://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService/getHoliDeInfo'
              f'?serviceKey={api_key}'
              f'&solYear={year}'
              f'&solMonth={month_str}'
              f'&_type=json'
              f'&numOfRows=50'
            )
            try:
              req = urllib.request.Request(url, headers={'Accept': 'application/json'})
              with urllib.request.urlopen(req, timeout=10) as res:
                data = json.loads(res.read().decode('utf-8'))
                items = data.get('response', {}).get('body', {}).get('items', {})
                if items:
                  item_list = items.get('item', [])
                  if isinstance(item_list, dict):
                    item_list = [item_list]
                  for item in item_list:
                    date_str = str(item.get('locdate', ''))
                    if date_str:
                      all_holidays[date_str] = {
                        'name': item.get('dateName', ''),
                        'isHoliday': item.get('isHoliday', 'N') == 'Y'
                      }
              print(f'{month_str}월 완료')
            except Exception as e:
              print(f'{month_str}월 오류: {e}')

          result = {
            '_meta': {
              'year': year,
              'source': '한국천문연구원 특일정보 API',
              'updated': __import__('datetime').datetime.now(__import__('datetime').UTC).isoformat()
            },
            'holidays': all_holidays
          }

          with open('${OUTPUT_FILE}', 'w', encoding='utf-8') as f:
            json.dump(result, f, ensure_ascii=False, indent=2)

          print(f'공휴일 {len(all_holidays)}건 저장 완료')
          PYEOF

      - name: Fetch lunar data
        env:
          KASI_API_KEY: ${{ secrets.KASI_API_KEY }}
        run: |
          YEAR="${{ steps.date.outputs.year }}"

          echo "음력 데이터 수집 중: ${YEAR}년 (1~12월, 기존 파일은 건너뜀)"

          python3 << PYEOF
          import urllib.request
          import json
          import os
          import calendar
          import time
          import datetime

          api_key = os.environ['KASI_API_KEY']
          year = '${YEAR}'

          made = []
          skipped = []

          for m in range(1, 13):
            month = str(m).zfill(2)
            output_file = f'data/lunar-{year}-{month}.json'

            # 이미 있는 달은 건너뜀 (음력은 변하지 않으므로 박제)
            if os.path.exists(output_file):
              skipped.append(month)
              continue

            days_in_month = calendar.monthrange(int(year), m)[1]
            lunar_data = {}

            for day in range(1, days_in_month + 1):
              day_str = str(day).zfill(2)
              url = (
                f'http://apis.data.go.kr/B090041/openapi/service/LrsrCldInfoService/getLunCalInfo'
                f'?serviceKey={api_key}'
                f'&solYear={year}'
                f'&solMonth={month}'
                f'&solDay={day_str}'
                f'&_type=json'
              )
              try:
                req = urllib.request.Request(url, headers={'Accept': 'application/json'})
                with urllib.request.urlopen(req, timeout=10) as res:
                  data = json.loads(res.read().decode('utf-8'))
                  item = data.get('response', {}).get('body', {}).get('items', {}).get('item', {})
                  if item:
                    lunar_data[f'{year}{month}{day_str}'] = {
                      'lunMonth': item.get('lunMonth', ''),
                      'lunDay': item.get('lunDay', ''),
                      'lunLeapmonth': item.get('lunLeapmonth', ''),
                    }
              except Exception as e:
                print(f'{month}-{day_str} 오류: {e}')
              time.sleep(0.1)  # 서버 배려

            result = {
              '_meta': {
                'year': year,
                'month': month,
                'source': '한국천문연구원 음양력정보 API',
                'updated': datetime.datetime.now(datetime.UTC).isoformat()
              },
              'lunar': lunar_data
            }

            with open(output_file, 'w', encoding='utf-8') as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

            made.append(month)
            print(f'{month}월: {len(lunar_data)}일 저장')

          print(f'신규 저장: {len(made)}개월 {made}')
          print(f'건너뜀(기존): {len(skipped)}개월 {skipped}')
          PYEOF

      - name: Fetch post publish dates
        run: |
          echo "게시글 발행일 수집 중 (sitemap + 페이지 메타태그)"

          python3 << 'PYEOF'
          import urllib.request
          import json
          import re
          import os
          import time
          import datetime

          BLOG = 'https://mjcoffeescience.tistory.com'
          ARCHIVE_FILE = 'data/posts.json'
          UA = 'Mozilla/5.0 (compatible; mjcafe-calendar-bot/1.0)'

          def fetch(url, timeout=15):
              req = urllib.request.Request(url, headers={'User-Agent': UA})
              with urllib.request.urlopen(req, timeout=timeout) as res:
                  return res.read().decode('utf-8', errors='replace')

          # 1) 기존 archive 로드 (있으면 이미 박제된 글은 재수집 안 함)
          posts = {}
          if os.path.exists(ARCHIVE_FILE):
              try:
                  with open(ARCHIVE_FILE, encoding='utf-8') as f:
                      posts = json.load(f).get('posts', {})
                  print(f'기존 archive 로드: {len(posts)}건')
              except Exception as e:
                  print(f'archive 로드 실패(무시): {e}')

          # posts는 {글번호(str): {date,title,url}} 형태로 메모리에서 관리 후
          # 마지막에 날짜별 그룹으로 변환
          # 기존 archive가 날짜별 그룹이면 글번호 맵으로 역변환
          if posts and all(k.isdigit() and len(k) == 8 for k in posts):
              flat = {}
              for ymd, arr in posts.items():
                  for p in arr:
                      flat[str(p['n'])] = {'date': ymd, 'title': p.get('t', ''), 'url': p['u']}
              posts = flat
              print(f'  → 글번호 맵으로 역변환: {len(posts)}건')

          # 2) 사이트맵에서 현재 존재하는 글번호 목록 추출
          sitemap = fetch(f'{BLOG}/sitemap.xml')
          nums = re.findall(rf'{re.escape(BLOG)}/(\d+)</loc>', sitemap)
          nums = sorted(set(int(n) for n in nums))
          print(f'사이트맵 글 번호: {len(nums)}개 ({min(nums)}~{max(nums)})')

          # 3) archive에 없는 번호만 페이지 fetch → 발행일+제목 추출
          PUB_RE = re.compile(
              r'<meta[^>]+property=["\']article:published_time["\'][^>]+content=["\']([^"\']+)["\']')
          OG_TITLE_RE = re.compile(
              r'<meta[^>]+property=["\']og:title["\'][^>]+content=["\']([^"\']+)["\']')

          new_count = 0
          fail = []
          for n in nums:
              key = str(n)
              if key in posts and posts[key].get('date'):
                  continue  # 이미 박제됨 — 발행일은 안 바뀌므로 skip
              url = f'{BLOG}/{n}'
              try:
                  html = fetch(url)
                  m = PUB_RE.search(html)
                  if not m:
                      fail.append(n)
                      continue
                  iso = m.group(1)          # 2024-12-19T15:13:01+09:00
                  ymd = iso[:10].replace('-', '')  # 20241219
                  tm = OG_TITLE_RE.search(html)
                  title = tm.group(1).strip() if tm else ''
                  posts[key] = {'date': ymd, 'title': title, 'url': url}
                  new_count += 1
                  if new_count % 20 == 0:
                      print(f'  ... {new_count}건 수집')
                  time.sleep(0.3)  # 서버 배려
              except Exception as e:
                  fail.append(n)

          print(f'신규 수집: {new_count}건, 실패: {len(fail)}건')
          if fail:
              print(f'  실패 번호: {fail[:30]}{" ..." if len(fail)>30 else ""}')

          # 4) 날짜별 그룹으로 변환 → posts.json 저장
          by_date = {}
          for key, p in posts.items():
              ymd = p['date']
              entry = {'n': int(key), 'u': p['url']}
              if p.get('title'):
                  entry['t'] = p['title']
              by_date.setdefault(ymd, []).append(entry)
          # 같은 날 여러 글이면 글번호 내림차순(최신 먼저)
          for ymd in by_date:
              by_date[ymd].sort(key=lambda e: e['n'], reverse=True)

          result = {
              '_meta': {
                  'source': 'tistory page <meta article:published_time>',
                  'total': len(posts),
                  'updated': datetime.datetime.utcnow().isoformat() + 'Z'
              },
              'posts': dict(sorted(by_date.items()))
          }
          with open(ARCHIVE_FILE, 'w', encoding='utf-8') as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
          print(f'posts.json 저장 완료: 총 {len(posts)}건, {len(by_date)}일')
          PYEOF

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          Y="${{ steps.date.outputs.year }}"
          M="${{ steps.date.outputs.month }}"

          # 공휴일·음력 (매월 갱신분)
          git add data/holidays-*.json data/lunar-*.json
          if git diff --staged --quiet; then
            echo "공휴일·음력 변경 없음"
          else
            git commit -m "chore(calendar): update holidays/lunar ${Y}-${M}"
          fi

          # 게시글 발행일 (신규 글 있을 때만)
          git add data/posts.json
          if git diff --staged --quiet; then
            echo "게시글 변경 없음"
          else
            git commit -m "chore(calendar): update post publish dates"
          fi

          # 둘 중 하나라도 커밋됐으면 push
          git push || echo "push할 변경 없음"
